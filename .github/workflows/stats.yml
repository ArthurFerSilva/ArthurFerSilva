name: Gerar estatisticas

on:
  workflow_dispatch:
  schedule:
    - cron: "0 3 * * *"

permissions:
  contents: write

jobs:
  gerar-estatisticas:
    runs-on: ubuntu-latest

    steps:
      - name: Baixar repositorio
        uses: actions/checkout@v6

      - name: Gerar quadro de linguagens
        uses: stats-organization/github-readme-stats-action@v2
        with:
          card: top-langs
          options: 'layout=compact&langs_count=8&hide_border=true&bg_color=0B1F16&title_color=39D353&text_color=8B949E&border_color=30363D'
          path: profile/top-langs.svg
          token: ${{ secrets.GITHUB_TOKEN }}

      - name: Gerar quadro de estatisticas
        uses: stats-organization/github-readme-stats-action@v2
        with:
          card: stats
          options: 'show_icons=true&include_all_commits=true&hide_border=true&bg_color=0B1F16&title_color=39D353&text_color=8B949E&icon_color=2EA043&border_color=30363D'
          path: profile/stats.svg
          token: ${{ secrets.GITHUB_TOKEN }}

      - name: Salvar estatisticas
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add profile/*.svg
          git commit -m "Atualizar estatisticas" || exit 0
          git push
