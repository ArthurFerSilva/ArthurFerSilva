name: Gerar estatisticas

on:
  workflow_dispatch:
  schedule:
    - cron: "0 3 * * *"

permissions:
  contents: write

jobs:
  gerar-estatisticas:
    runs-on: ubuntu-latest

    steps:
      - name: Baixar repositorio
        uses: actions/checkout@v4

      - name: Criar pasta profile
        run: mkdir -p profile

      - name: Gerar quadro de linguagens
        uses: stats-organization/github-readme-stats-action@v1
        with:
          token: ${{ secrets.GITHUB_TOKEN }}
          card: top-langs
          path: profile/top-langs.svg
          options: >
            username=${{ github.repository_owner }}
            &layout=compact
            &langs_count=8
            &hide_border=true
            &bg_color=0B1F16
            &title_color=39D353
            &text_color=8B949E

      - name: Gerar quadro de estatisticas
        uses: stats-organization/github-readme-stats-action@v1
        with:
          token: ${{ secrets.GITHUB_TOKEN }}
          card: stats
          path: profile/stats.svg
          options: >
            username=${{ github.repository_owner }}
            &show_icons=true
            &hide_border=true
            &bg_color=0B1F16
            &title_color=39D353
            &text_color=8B949E
            &icon_color=2EA043

      - name: Salvar arquivos
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add profile/*.svg
          git commit -m "Atualizar estatisticas" || exit 0
          git push
