<svg width="900" height="140" viewBox="0 0 900 140"
     xmlns="http://www.w3.org/2000/svg">

  <defs>
    <linearGradient id="bg" x1="0" x2="1">
      <stop offset="0%" stop-color="#030806"/>
      <stop offset="50%" stop-color="#07120D"/>
      <stop offset="100%" stop-color="#030806"/>
    </linearGradient>

    <filter id="softGlow">
      <feGaussianBlur stdDeviation="2" result="blur"/>
      <feMerge>
        <feMergeNode in="blur"/>
        <feMergeNode in="SourceGraphic"/>
      </feMerge>
    </filter>
  </defs>

  <rect width="900" height="140" rx="14" fill="url(#bg)"/>

  <text x="450" y="78"
        text-anchor="middle"
        font-family="monospace"
        font-size="30"
        font-weight="600"
        letter-spacing="3"
        fill="#4F8A68"
        filter="url(#softGlow)">

    WELCOME TO MY GITHUB

    <animate
      attributeName="opacity"
      values="0.45;1;0.45"
      dur="3s"
      repeatCount="indefinite"/>

  </text>

  <rect x="345" y="100"
        width="210" height="2"
        rx="1"
        fill="#1E4D36">

    <animate
      attributeName="width"
      values="80;210;80"
      dur="3s"
      repeatCount="indefinite"/>

    <animate
      attributeName="x"
      values="410;345;410"
      dur="3s"
      repeatCount="indefinite"/>

  </rect>

