<svg width="900" height="170" viewBox="0 0 900 170"
     xmlns="http://www.w3.org/2000/svg">

  <defs>
    <!-- brilho suave -->
    <filter id="glow">
      <feGaussianBlur stdDeviation="2.5" result="blur"/>
      <feMerge>
        <feMergeNode in="blur"/>
        <feMergeNode in="SourceGraphic"/>
      </feMerge>
    </filter>

    <!-- revela o texto como se estivesse sendo digitado -->
    <clipPath id="reveal">
      <rect x="140" y="38" width="0" height="40">
        <animate
          attributeName="width"
          values="0;0;620;620;0"
          keyTimes="0;0.08;0.55;0.88;1"
          dur="6s"
          repeatCount="indefinite"/>
      </rect>
    </clipPath>
  </defs>

  <!-- fundo -->
  <rect width="900" height="170" rx="14" fill="#06110D"/>

  <!-- borda -->
  <rect x="4" y="4" width="892" height="162" rx="12"
        fill="none" stroke="#095C41" stroke-width="2" opacity="0.8"/>

  <!-- texto pequeno topo -->
  <text x="30" y="28"
        font-family="monospace"
        font-size="12"
        fill="#84D58D">
    SYSTEM://PROFILE_BOOT
  </text>

  <!-- título com efeito -->
  <g clip-path="url(#reveal)">
    <text x="450" y="72"
          text-anchor="middle"
          font-family="monospace"
          font-size="28"
          font-weight="bold"
          fill="#3CBB65"
          filter="url(#glow)">
      WELCOME TO MY GITHUB PROFILE
    </text>
  </g>

  <!-- sombra/glitch leve atrás -->
  <text x="450" y="72"
        text-anchor="middle"
        font-family="monospace"
        font-size="28"
        font-weight="bold"
        fill="#0AA85C"
        opacity="0">
    WELCOME TO MY GITHUB PROFILE
    <animate attributeName="opacity"
             values="0;0;0.25;0;0"
             keyTimes="0;0.68;0.72;0.76;1"
             dur="6s"
             repeatCount="indefinite"/>
  </text>

  <!-- cursor piscando -->
  <rect x="140" y="78" width="14" height="4" rx="1" fill="#84D58D">
    <animate
      attributeName="x"
      values="140;140;760;760;140"
      keyTimes="0;0.08;0.55;0.88;1"
      dur="6s"
      repeatCount="indefinite"/>
    <animate
      attributeName="opacity"
      values="1;0.2;1"
      dur="0.7s"
      repeatCount="indefinite"/>
  </rect>

  <!-- subtítulo -->
  <text x="450" y="108"
        text-anchor="middle"
        font-family="monospace"
        font-size="14"
        fill="#84D58D">
    &gt; ARTHUR FERNANDES | DEVELOPER_
  </text>

  <!-- linha inferior -->
  <rect x="120" y="132" width="660" height="2" fill="#095C41">
    <animate
      attributeName="opacity"
      values="0.2;1;0.2"
      dur="2s"
      repeatCount="indefinite"/>
  </rect>

  <!-- scanline suave -->
  <rect x="20" y="0" width="860" height="2" fill="#84D58D" opacity="0.10">
    <animate
      attributeName="y"
      values="15;150;15"
      dur="4s"
      repeatCount="indefinite"/>
  </rect>

</svg>
