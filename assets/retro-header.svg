
<svg width="1000" height="230" viewBox="0 0 1000 230"
     xmlns="http://www.w3.org/2000/svg">

  <defs>

    <!-- FUNDO -->
    <linearGradient id="bg" x1="0" x2="1">
      <stop offset="0%" stop-color="#050907"/>
      <stop offset="50%" stop-color="#071A12"/>
      <stop offset="100%" stop-color="#050907"/>
    </linearGradient>

    <!-- GRID PIXEL -->
    <pattern id="grid" width="20" height="20"
             patternUnits="userSpaceOnUse">
      <path d="M20 0H0V20"
            fill="none"
            stroke="#123524"
            stroke-width="0.6"
            opacity="0.35"/>
    </pattern>

    <!-- BRILHO VERDE -->
    <filter id="glow">
      <feGaussianBlur stdDeviation="3" result="blur"/>
      <feMerge>
        <feMergeNode in="blur"/>
        <feMergeNode in="SourceGraphic"/>
      </feMerge>
    </filter>

    <!-- REVELAÇÃO DO TEXTO -->
    <clipPath id="reveal">
      <rect x="60" y="65" width="0" height="65">

        <animate
          attributeName="width"
          values="0;0;850;850;0"
          keyTimes="0;0.08;0.50;0.90;1"
          dur="7s"
          repeatCount="indefinite"
        />

      </rect>
    </clipPath>

  </defs>


  <!-- FUNDO -->
  <rect width="1000"
        height="230"
        rx="12"
        fill="url(#bg)"/>

  <rect width="1000"
        height="230"
        rx="12"
        fill="url(#grid)"/>


  <!-- BORDA -->
  <rect x="3"
        y="3"
        width="994"
        height="224"
        rx="10"
        fill="none"
        stroke="#1F6F43"
        stroke-width="2"
        opacity="0.7"/>


  <!-- DETALHES SUPERIORES -->
  <circle cx="30" cy="28" r="5" fill="#2EA043">
    <animate attributeName="opacity"
             values="1;0.25;1"
             dur="1.2s"
             repeatCount="indefinite"/>
  </circle>

  <text x="45"
        y="33"
        fill="#607D6C"
        font-family="monospace"
        font-size="13">
    SYSTEM://PROFILE_BOOT
  </text>

  <text x="810"
        y="33"
        fill="#1F6F43"
        font-family="monospace"
        font-size="12">
    [ ONLINE ]
  </text>


  <!-- GLITCH ATRÁS -->
  <text x="71"
        y="112"
        font-family="monospace"
        font-weight="bold"
        font-size="31"
        letter-spacing="2"
        fill="#0E4429"
        opacity="0">

    WELCOME TO MY GITHUB PROFILE

    <animate
      attributeName="opacity"
      values="0;0;0.7;0;0;0.5;0"
      keyTimes="0;0.70;0.72;0.74;0.80;0.82;1"
      dur="4s"
      repeatCount="indefinite"/>

    <animate
      attributeName="x"
      values="71;66;75;71"
      dur="0.25s"
      repeatCount="indefinite"/>

  </text>


  <!-- TEXTO PRINCIPAL -->
  <g clip-path="url(#reveal)">

    <text x="70"
          y="112"
          fill="#2EA043"
          font-family="monospace"
          font-weight="bold"
          font-size="31"
          letter-spacing="2"
          filter="url(#glow)">

      WELCOME TO MY GITHUB PROFILE

    </text>

  </g>


  <!-- CURSOR QUE CORRE JUNTO -->
  <rect x="70"
        y="120"
        width="17"
        height="5"
        rx="1"
        fill="#1F6F43">

    <animate
      attributeName="x"
      values="70;70;860;860;70"
      keyTimes="0;0.08;0.50;0.90;1"
      dur="7s"
      repeatCount="indefinite"/>

    <animate
      attributeName="opacity"
      values="1;0.15;1"
      dur="0.5s"
      repeatCount="indefinite"/>

  </rect>


  <!-- SUBTÍTULO -->
  <text x="70"
        y="158"
        fill="#607D6C"
        font-family="monospace"
        font-size="15">

    &gt; PLAYER: ARTHUR FERNANDES

  </text>


  <text x="70"
        y="184"
        fill="#3F6650"
        font-family="monospace"
        font-size="13">

    &gt; CLASS: DEVELOPER  |  STATUS: CODING

  </text>


  <!-- BARRA DE ENERGIA -->
  <text x="70"
        y="211"
        fill="#607D6C"
        font-family="monospace"
        font-size="11">

    DEV ENERGY

  </text>

  <rect x="160"
        y="201"
        width="230"
        height="10"
        rx="2"
        fill="#0D1117"
        stroke="#123524"/>

  <rect x="162"
        y="203"
        height="6"
        width="20"
        rx="1"
        fill="#1F6F43">

    <animate
      attributeName="width"
      values="20;100;180;220;170;220"
      dur="5s"
      repeatCount="indefinite"/>

  </rect>


  <!-- PIXELS FLUTUANDO -->
  <rect x="900" y="70"
        width="5" height="5"
        fill="#1F6F43">

    <animate
      attributeName="y"
      values="70;180;70"
      dur="5s"
      repeatCount="indefinite"/>

    <animate
      attributeName="opacity"
      values="0;1;0"
      dur="5s"
      repeatCount="indefinite"/>

  </rect>

  <rect x="930" y="150"
        width="4" height="4"
        fill="#123524">

    <animate
      attributeName="y"
      values="150;55;150"
      dur="7s"
      repeatCount="indefinite"/>

  </rect>


  <!-- SCANLINE -->
  <rect x="5"
        y="0"
        width="990"
        height="2"
        fill="#2EA043"
        opacity="0.12">

    <animate
      attributeName="y"
      values="5;220;5"
      dur="4s"
      repeatCount="indefinite"/>

  </rect>

</svg>
